name: CI
on:
  push:
    branches: [master]
    tags: ["*"]
  pull_request:
jobs:
  test:
    name: Julia ${{ matrix.version }} - JSON ${{ matrix.json }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.8'
          - '1' # automatically expands to the latest stable 1.x release of Julia
          - nightly
        # Both supported JSON.jl majors: the writer customisation API differs
        # between them, and the resolver would otherwise only ever pick one.
        json:
          - '0.21'
          - '1'
        os:
          - ubuntu-latest
        arch:
          - x64
        exclude:
          # JSON 1.x needs julia >= 1.10
          - version: '1.8'
            json: '1'
        include:
          # test macOS and Windows with latest Julia only
          - os: macOS-latest
            arch: x64
            version: 1
            json: '1'
          - os: windows-latest
            arch: x64
            version: 1
            json: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - name: Pin JSON ${{ matrix.json }}
        run: julia --project=. -e 'using Pkg; Pkg.add(PackageSpec(name="JSON", version="${{ matrix.json }}"))'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          file: lcov.info
